name: Cometa Crescita - aggiorna e pubblica le quote

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    # Ogni mercoledi alle 07:21 UTC; GitHub non garantisce ora esatta.
    - cron: '21 7 * * 3'

permissions:
  contents: read

concurrency:
  group: cometa-crescita-gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout progetto
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa dipendenze
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test parser e feed
        run: python -m unittest discover -s tests -v
      - name: Acquisisci e valida le quotazioni ufficiali
        run: python scripts/fetch_cometa.py --outdir site
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara l'artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
